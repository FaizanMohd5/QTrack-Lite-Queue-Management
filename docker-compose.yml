services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qtrack
      POSTGRES_USER: qtrack
      POSTGRES_PASSWORD: qtrack
    ports:
      - "5432:5432"
    volumes:
      - qtrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtrack -d qtrack"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://qtrack:qtrack@postgres:5432/qtrack
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/server
    command: ["npx", "prisma", "migrate", "deploy"]

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://qtrack:qtrack@postgres:5432/qtrack
      FRONTEND_ORIGIN: http://localhost:8080
      SESSION_SECRET: local-docker-session-secret-change-in-production
      SESSION_TTL_HOURS: 12
      SHOP_SLUG: habib-clinic
      SHOP_NAME: Habib Clinic
      SHOP_TIMEZONE: Asia/Kolkata
      OWNER_PASSWORD: demo123456
      SEED_DEMO_QUEUE: "true"
      LOG_LEVEL: debug
      TRUST_PROXY: "true"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-c", "node dist/seed.js && node dist/server.js"]

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_started

volumes:
  qtrack_postgres_data:
